<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ErrorTrack</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="barra">
        <button class="barramudar" aria-label="Expandir barra">›</button>
        <nav class="barramenu">
            <a href="#" class="barraitem"><span class="barratexto">ErrorTrack</span></a>
        </nav>
    </div>

    <main class="conteudo">
        <div id="mensagem" class="mensagem" aria-live="polite"></div>

        <!-- SEÇÃO ALUNOS -->
        <section class="crud">
            <h1>1. Gestão de Alunos</h1>
            
            <form id="alunoForm" class="formulario">
                <input type="hidden" id="alunoId">
                <input type="text" id="nome" placeholder="Nome do aluno" required>
                <input type="text" id="materia" placeholder="Matéria" required>
                <button type="submit" id="formButton">Criar Aluno</button>
                <button type="button" id="cancelarAtualizacao" class="secundario hidden">Cancelar</button>
            </form>

            <form id="buscarForm" class="buscar">
                <input type="number" id="buscarId" placeholder="Buscar por ID">
                <button type="submit">Buscar ID</button>
            </form>

            <form id="buscarNomeForm" class="buscar">
                <input type="text" id="buscarNome" placeholder="Buscar por Nome (Procedure)">
                <button type="submit">Buscar Nome</button>
            </form>

            <div id="listaAlunos" class="lista"></div>
        </section>

        <hr style="margin: 40px 0; border-color: #ffffff22;">

        <!-- SEÇÃO QUESTÕES -->
        <section class="crud">
            <h1>2. Gestão de Questões</h1>
            <form id="questaoForm" class="formulario">
                <input type="text" id="enunciado" placeholder="Enunciado da questão" required>
                <input type="text" id="alternativaCorreta" placeholder="Alternativa Correta (ex: A)" required>
                <button type="submit">Cadastrar Questão</button>
            </form>

            <form id="buscarSimuladoForm" class="buscar">
                <input type="number" id="buscarSimuladoId" placeholder="ID do Simulado (Procedure)">
                <button type="submit">Buscar por Simulado</button>
            </form>

            <button id="btnListarQuestoes">Listar Todas as Questões</button>
            <div id="listaQuestoes" class="lista" style="margin-top: 15px;"></div>
        </section>

        <hr style="margin: 40px 0; border-color: #ffffff22;">

        <!-- SEÇÃO RELATÓRIO DE ERROS -->
        <section class="crud">
            <h1>3. Relatório de Erros</h1>
            <form id="relatorioForm" class="buscar">
                <input type="number" id="relatorioAlunoId" placeholder="ID do Aluno (Procedure)" required>
                <button type="submit">Gerar Relatório de Erros</button>
            </form>
            <div id="listaRelatorio" class="lista" style="margin-top: 15px;"></div>
        </section>
    </main>

    <script src="script.js"></script>
</body>
</html>
